# Menerbitkan landing page statis (folder site/) ke GitHub Pages.
# Sekali saja: Settings > Pages > Build and deployment > Source: "GitHub Actions".
name: Landing page

on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/landing-page.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  terbitkan:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4

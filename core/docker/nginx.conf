# SENTRA Core: hanya HTTPS. Agent memakai https://sentra-core, browser https://localhost:8443.
server {
    # Sintaks nginx 1.24 (Ubuntu 24.04).
    listen 443 ssl http2;
    server_name _;

    ssl_certificate     /var/lib/sentra/tls/server.crt;
    ssl_certificate_key /var/lib/sentra/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/core/public;
    index index.php;
    client_max_body_size 8m;
    server_tokens off;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # WebSocket Laravel Reverb (dashboard live).
    location /app {
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_pass http://127.0.0.1:8080;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param HTTPS on;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}

[program:plc]
command=/usr/bin/python3 /opt/plc/plc_server.py
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:sentra-agent]
command=/usr/local/bin/sentra-agent-run
autorestart=true
startretries=100
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

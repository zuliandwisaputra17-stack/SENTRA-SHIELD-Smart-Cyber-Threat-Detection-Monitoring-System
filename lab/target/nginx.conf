# Portal dummy LINGKUNGAN LATIHAN (sengaja rentan). Jangan dipasang di internet.
server {
    listen 80 default_server;
    server_name _;
    root /var/www/html;
    index index.php;
    access_log /var/log/nginx/access.log combined;
    server_tokens off;

    location / {
        try_files $uri $uri/ =404;
    }

    # Celah disengaja: file PHP di folder unggahan ikut dieksekusi (skenario webshell).
    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }
}

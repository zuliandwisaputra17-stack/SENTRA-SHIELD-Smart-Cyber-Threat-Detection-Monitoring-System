[program:php-fpm]
command=/usr/sbin/php-fpm8.3 -F
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:sshd]
command=/usr/sbin/sshd -D -E /var/log/auth.log
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; Untuk skenario Sensor Buta: `docker compose exec kodim-b supervisorctl stop sentra-agent`
[program:sentra-agent]
command=/usr/local/bin/sentra-agent-run
autorestart=true
startretries=100
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
